version: 2
updates:
  # ルートと packages/* だけを対象にする。corpus/ 配下は検証用の固定フィクスチャなので更新しない。
  - package-ecosystem: npm
    directories:
      - /
      - /packages/*
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # 対応する最も古い Node.js（engines: >=22）に型定義を合わせる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 は JavaScript から使う Compiler API（ts.isIdentifier など）を提供しない。
      # packages/parser がこの API に依存しているため、6.x までに留める
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
